; Dial 100 from the softphone -> call enters the Stasis app "call-events" (our service).
[from-internal]
exten => 100,1,NoOp(Inbound to IVR from ${CALLERID(num)})
 same => n,Stasis(call-events)
 same => n,Hangup()

; Targets the IVR routes to with continueInDialplan(). Stand-ins for real queues/extensions.
[queues]
exten => sales,1,NoOp(Routed to SALES queue)
 same => n,Answer()
 same => n,Playback(queue-thankyou)
 same => n,Echo()
 same => n,Hangup()

exten => support,1,NoOp(Routed to SUPPORT queue)
 same => n,Answer()
 same => n,Playback(queue-thankyou)
 same => n,Echo()
 same => n,Hangup()

[internal]
exten => 1000,1,NoOp(Routed to OPERATOR)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Echo()
 same => n,Hangup()
