; One softphone account (6001) so you can call the IVR from Zoiper/Linphone on the same machine.
; LOCAL DEV ONLY credentials.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[6001]
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw,opus
auth = 6001
aors = 6001
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[6001]
type = auth
auth_type = userpass
username = 6001
password = local-dev-6001

[6001]
type = aor
max_contacts = 1
